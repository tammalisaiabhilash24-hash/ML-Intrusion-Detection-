services:
  - type: web
    name: netshield-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/netshield-ai.db